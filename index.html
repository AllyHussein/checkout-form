<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Theme Toggle -->
    <div id="theme-toggle">
      <span id="sun-icon">☀️</span>
      <span id="moon-icon" class="hidden">🌙</span>
    </div>

    <form id="checkout-form">
      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>

      <!-- Step 1: Personal Info -->
      <fieldset class="step active">
        <legend>Personal Information</legend>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required />
        <p class="error-message" aria-live="polite"></p>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />
        <p class="error-message" aria-live="polite"></p>

        <button type="button" class="next-btn">Next</button>
      </fieldset>

      <!-- Step 2: Address -->
      <fieldset class="step">
        <legend>Shipping Address</legend>

        <label for="address">Address</label>
        <input type="text" id="address" name="address" required />
        <p class="error-message" aria-live="polite"></p>

        <label for="zip">ZIP Code</label>
        <input type="text" id="zip" name="zip" required pattern="\d{5}" />
        <p class="error-message" aria-live="polite"></p>

        <button type="button" class="prev-btn">Back</button>
        <button type="button" class="next-btn">Next</button>
      </fieldset>

      <!-- Step 3: Payment -->
      <fieldset class="step">
        <legend>Payment Details</legend>

        <label for="card">Credit Card</label>
        <input type="text" id="card" name="card" required pattern="\d{16}" />
        <p class="error-message" aria-live="polite"></p>

        <label for="cvv">CVV</label>
        <input type="text" id="cvv" name="cvv" required pattern="\d{3}" />
        <p class="error-message" aria-live="polite"></p>

        <button type="button" class="prev-btn">Back</button>
        <button type="submit">Submit</button>
      </fieldset>
    </form>

    <!-- Success Message -->
    <div id="success-message" class="hidden">
      <h2>🎉 Success!</h2>
      <p>Your order has been placed successfully.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
